# Grant the intel-tdx-dcap service account the privileged SCC so that:
# - the platform-registration initContainer can run as privileged, and
# - the tdx-qgs container can use seLinuxOptions.type: spc_t to bind
#   its Unix domain socket on the host /var/run/tdx-qgs path.
# Used for non-OLM installs; OLM installs get this via the bundle manifest.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: intel-tdx-dcap-scc-privileged
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
- kind: ServiceAccount
  name: intel-tdx-dcap
  namespace: intel-dcap-operator-system
