# OLM only: operator-sdk turns this into a CSV permissions entry for the
# intel-tdx-dcap-qgs ServiceAccount and OLM creates it in the install namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: intel-tdx-dcap-qgs-scc-privileged
rules:
- apiGroups:
  - security.openshift.io
  resourceNames:
  - privileged
  resources:
  - securitycontextconstraints
  verbs:
  - use
