apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace where the operator will be deployed
namespace: intel-dcap-operator-system

namePrefix: intel-tdx-dcap-

# Resources to include in the deployment
resources:
- ../crd
- ../rbac
- ../manager

# CommonLabels added to all resources
labels:
- pairs:
    app.kubernetes.io/part-of: intel-dcap-operator

# Inject the resolved QGS ServiceAccount name (namePrefix + "qgs") into the
# manager deployment's QGS_SERVICE_ACCOUNT env var so namePrefix is the single
# place to update when the prefix changes.
replacements:
- source:
    kind: ServiceAccount
    name: qgs
    fieldPath: metadata.name
  targets:
  - select:
      kind: Deployment
      name: controller-manager
    fieldPaths:
    - spec.template.spec.containers.[name=operator].env.[name=QGS_SERVICE_ACCOUNT].value
