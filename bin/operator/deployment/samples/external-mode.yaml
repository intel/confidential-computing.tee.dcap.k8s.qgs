# Example: TdxQuoteGenerationService with External Platform Registration
#
# This example demonstrates deploying the TDX Quote Generation Service
# when platform data secrets are managed by an external process.
#
# In External mode:
# - No registrar Deployment is created
# - No platform-registration initContainer is created
# - No efivars volume is mounted
# - Platform data secrets must be created externally before QGS pods start
# - Secrets should be labeled with fmspc=<value> for discovery
#
# This mode is useful when:
# - Platform data is provisioned by a separate automation system
# - Certificate secrets are synced from external secret stores (e.g., External Secrets Operator)
# - You want to decouple platform registration from QGS pod lifecycle
#
# Prerequisites:
# 1. Externally create PCK certificate secrets for each platform
# 2. Ensure secrets are labeled: fmspc=<value>
# 3. Ensure nodes are labeled with SGX capability:
#    kubectl label nodes <node-name> intel.feature.node.kubernetes.io/sgx=true
#
# Apply with: kubectl apply -f external-mode.yaml

apiVersion: trustedservices.intel.com/v1
kind: TdxQuoteGenerationService
metadata:
  name: intel-tdx-dcap
  labels:
    app.kubernetes.io/name: tdx-quote-generation-service
    app.kubernetes.io/managed-by: intel-tdx-dcap-operator
spec:
  platformRegistration:
    External: {}
  nodeSelector:
    - "intel.feature.node.kubernetes.io/sgx=true"
