apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
  namespace: system
rules:
# Permissions for managing the QGS DaemonSet
# list and watch verbs needed: the controller reconciles on changes to it
# create verb needed: server-side apply creates the object on first reconcile
# No delete verb: the DaemonSet is garbage collected through its owner reference
- apiGroups:
  - apps
  resources:
  - daemonsets
  verbs:
  - get
  - list
  - watch
  - create
  - patch

# Permissions for managing the registrar Deployment
# list and watch verbs needed: the controller reconciles on changes to it
# create verb needed: server-side apply creates the object on first reconcile
# delete verb needed: operator explicitly deletes when switching to Offline or External mode
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - delete
