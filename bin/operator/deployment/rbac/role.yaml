apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
  namespace: system
rules:
# Permissions for managing DaemonSets
# delete verb needed: operator explicitly deletes when switching modes
- apiGroups:
  - apps
  resources:
  - daemonsets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

# Permissions for managing Deployments (registrar)
# delete verb needed: operator explicitly deletes when switching to Offline mode
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

# Permissions for managing Secrets (PCK certificate data per node)
# No delete verb: resources have ownerReferences and are garbage collected
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - patch

# Permissions for managing ServiceAccounts (for QGS/registrar pods)
# No delete verb: resources have ownerReferences and are garbage collected
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch

# Permissions for managing Roles (grant QGS/registrar pods access to secrets)
# No delete verb: resources have ownerReferences and are garbage collected
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch

# Permissions for managing RoleBindings (bind ServiceAccounts to Roles)
# No delete verb: resources have ownerReferences and are garbage collected
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
