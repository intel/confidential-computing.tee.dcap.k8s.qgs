apiVersion: apps/v1
kind: Deployment
metadata:
  name: intel-tdx-registrar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intel-tdx-registrar
  template:
    metadata:
      labels:
        app: intel-tdx-registrar
    spec:
      serviceAccountName: intel-tdx-dcap-qgs
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: registrar
        image: intel-tdx-qgs:latest
        imagePullPolicy: IfNotPresent
        command:
        - pck-cert-tool
        - register
        - -n
        - $(NAMESPACE)
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: INTEL_PCS_API_KEY
          valueFrom:
            secretKeyRef:
              name: intel-pcs-api-key
              key: api-key
              optional: true
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
