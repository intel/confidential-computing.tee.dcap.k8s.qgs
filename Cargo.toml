[workspace]
resolver = "3"
members = [
    "bin/pck-cert-tool",
    "bin/operator",
]

[workspace.dependencies]
# Kubernetes — crypto backend: swap "ring" ↔ "aws-lc-rs" here to switch;
# also update x509-parser in bin/pck-cert-tool/Cargo.toml ("verify" → "verify-aws")
kube = { version = "3.1.0", features = ["rustls-tls", "ring"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }

# Async runtime
tokio = { version = "1.52", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
