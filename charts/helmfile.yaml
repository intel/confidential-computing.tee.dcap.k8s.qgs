environments:
  default:
    values:
      - intelDevicePluginVersion: 0.37.0
      - nfdVersion: 0.19.0
      - intelSgxPluginVersion: 0.37.0-alpha.1
      - dcapValuesFile: ./helmfile-qgs-values/tdx-qgs-online-values.yaml.gotmpl
---
repositories:
  - name: nfd
    url: https://kubernetes-sigs.github.io/node-feature-discovery/charts
  - name: intel
    url: https://intel.github.io/helm-charts

helmDefaults:
  wait: true
  timeout: 600
  diffArgs:
    - --disable-validation
    - --disable-openapi-validation

releases:
  # --------------------------------------------------------------------------
  # Node Feature Discovery
  # --------------------------------------------------------------------------
  - name: nfd
    namespace: node-feature-discovery
    createNamespace: true
    chart: nfd/node-feature-discovery
    version: "{{ .Values.nfdVersion }}"
    hooks:
      - events: [ "postsync" ]
        showlogs: true
        command: kubectl
        args:
          - apply
          - -k
          - https://github.com/intel/intel-device-plugins-for-kubernetes/deployments/nfd/overlays/node-feature-rules?ref=v{{ .Values.intelDevicePluginVersion }}
      - events: [ "postuninstall" ]
        showlogs: true
        command: kubectl
        args:
          - delete
          - -k
          - https://github.com/intel/intel-device-plugins-for-kubernetes/deployments/nfd/overlays/node-feature-rules?ref=v{{ .Values.intelDevicePluginVersion }}

  # --------------------------------------------------------------------------
  # Intel SGX Device Plugin
  # --------------------------------------------------------------------------
  - name: intel-sgx-plugin
    namespace: kube-system
    chart: oci://ghcr.io/intel/intel-sgx-device-plugin
    version: "{{ .Values.intelSgxPluginVersion }}"
    needs:
      - node-feature-discovery/nfd

  # --------------------------------------------------------------------------
  # Intel TDX QGS
  # --------------------------------------------------------------------------
  - name: intel-tdx-qgs
    namespace: intel-dcap-operator-system
    createNamespace: true
    chart: ./intel-tdx-qgs
    needs:
      - kube-system/intel-sgx-plugin
    values:
      - "{{ .Values.dcapValuesFile }}"
