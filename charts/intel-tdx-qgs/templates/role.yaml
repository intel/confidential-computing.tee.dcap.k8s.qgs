{{- if .Values.tdxQuoteGenerationService.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "intel-tdx-qgs.fullname" . }}-pck-cert-tool
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "intel-tdx-qgs.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      {{- if ne .Values.tdxQuoteGenerationService.mode "External" }}
      - create
      - patch
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "intel-tdx-qgs.fullname" . }}-pck-cert-tool
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "intel-tdx-qgs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "intel-tdx-qgs.fullname" . }}-pck-cert-tool
subjects:
  - kind: ServiceAccount
    name: intel-tdx-dcap-qgs
    namespace: {{ .Release.Namespace }}
{{- end }}

