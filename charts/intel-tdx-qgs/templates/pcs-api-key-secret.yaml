{{- if and .Values.tdxQuoteGenerationService.enabled (eq .Values.tdxQuoteGenerationService.mode "Online") .Values.pcsApiKey.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.pcsApiKey.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "intel-tdx-qgs.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.pcsApiKey.apiKey | quote }}
{{- end }}

