{{- if .Values.tdxQuoteGenerationService.enabled -}}
{{- if not (has .Values.tdxQuoteGenerationService.mode (list "Online" "Offline" "External")) -}}
{{- fail "tdxQuoteGenerationService.mode must be one of: Online, Offline, External" -}}
{{- end -}}
{{- if and (eq .Values.tdxQuoteGenerationService.mode "Online") (not .Values.pcsApiKey.secretName) -}}
{{- fail "pcsApiKey.secretName must be set in Online mode" -}}
{{- end -}}
{{- end -}}

