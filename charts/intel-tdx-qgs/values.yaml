image:
  repository: docker.io/intel/intel-tdx-qgs
  # Defaults to the chart appVersion when empty.
  tag: ""
  # Optional image digest (sha256:...). When set, the image is pulled by digest.
  # Released charts pin the digest of the released image; clear it when overriding tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
# Example:
# imagePullSecrets:
#   - name: regcred

registrar:
  # Optional environment variables for example proxy which will be used by the registrar pod in Online mode.
  extraEnv: []

rbac:
  create: true

tdxQuoteGenerationService:
  # Deploy QGS directly. No CRD or operator is installed.
  enabled: true
  name: intel-tdx-dcap

  # One of: Online, Offline, External.
  # Online creates the registrar Deployment.
  # External omits platform registration and the efivars host mount.
  mode: Offline

  # Labels in key=value format used to select QGS nodes.
  nodeSelector:
    - "intel.feature.node.kubernetes.io/sgx=true"

# Intel PCS API key used by the registrar in Online mode. The key is optional:
# without it, the registrar makes anonymous (shared rate-limited) PCS requests.
pcsApiKey:
  # Secret the registrar reads the key from (data key "api-key").
  secretName: intel-pcs-api-key
  # If set, the chart creates secretName with this key. For production, create the
  # Secret yourself instead: Helm stores supplied values in its release Secret.
  apiKey: ""
