name: e2e tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    uses: ./.github/workflows/ci-rust.yaml
    permissions:
      contents: read

  docker:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: operator
            dockerfile: build/operator/Dockerfile
            context: .
            tag: intel-tdx-dcap-operator:latest
          - name: operator-ubi
            dockerfile: build/operator/ubi.Dockerfile
            context: .
            tag: intel-tdx-dcap-operator-ubi:latest
          - name: tdx-qgs
            dockerfile: build/tdx-qgs/Dockerfile
            context: .
            tag: intel-tdx-qgs:latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build ${{ matrix.name }}
        run: |
          docker buildx build \
            --cache-from type=gha,scope=${{ matrix.name }} \
            --cache-to   type=gha,mode=max,scope=${{ matrix.name }} \
            --load -t ${{ matrix.tag }} \
            -f ${{ matrix.dockerfile }} ${{ matrix.context }}
      - name: Save image
        run: docker save ${{ matrix.tag }} | gzip > /tmp/image.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.name }}
          path: /tmp/image.tar.gz
          retention-days: 1

  docker-qgs-test:
    name: Build tdx-qgs-test image
    needs: [docker]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download tdx-qgs image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-tdx-qgs
          path: /tmp/images
      - name: Load tdx-qgs image
        run: docker load < /tmp/images/image.tar.gz
      - name: Build tdx-qgs-test
        run: |
          docker build -t intel-tdx-qgs-test:latest \
            -f test/e2e/Dockerfile.test .
      - name: Save image
        run: docker save intel-tdx-qgs-test:latest | gzip > /tmp/image.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-tdx-qgs-test
          path: /tmp/image.tar.gz
          retention-days: 1

  e2e:
    name: Run e2e tests (k8s ${{ matrix.k8s_version }})
    needs: [rust, docker, docker-qgs-test]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - k8s_version: "1.37"
            node_image: "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
          - k8s_version: "1.36"
            node_image: "kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed"
    env:
      NUM_WORKERS: "2"
      SKIP_BUILD: "1"
      KIND_NODE_IMAGE: ${{ matrix.node_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kind
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Download image artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: /tmp/images

      - name: Load images into Docker
        run: |
          for f in /tmp/images/image-*/image.tar.gz; do docker load < "$f"; done

      - name: Run e2e
        run: test/e2e/run.sh
