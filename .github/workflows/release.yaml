name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tag_fix:
    name: Prepare image tag
    runs-on: ubuntu-26.04
    outputs:
      fixed_tag: ${{ steps.fix.outputs.tag }}
    env:
      TAGNAME: ${{ github.ref_name }}
    steps:
      - id: fix
        # Remove leading 'v' (e.g. v1.0.0 → 1.0.0)
        run: echo "tag=${TAGNAME:1}" >> "$GITHUB_OUTPUT"

  helm_verify:
    name: Verify Helm chart version
    needs:
      - tag_fix
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # write scope lets GHCR report "not found" (instead of "denied") before the first chart push
      packages: write
    outputs:
      chart_name: ${{ steps.chart.outputs.name }}
    env:
      CHART_REGISTRY: oci://ghcr.io/intel
      VERSION: ${{ needs.tag_fix.outputs.fixed_tag }}
    defaults:
      run:
        working-directory: charts/intel-tdx-qgs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Verify tag matches chart version and appVersion
        id: chart
        run: |
          name=$(yq '.name' Chart.yaml)
          chart_version=$(yq '.version' Chart.yaml)
          app_version=$(yq '.appVersion' Chart.yaml)
          if [ "${chart_version}" != "${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match chart version ${chart_version} in Chart.yaml"
            exit 1
          fi
          if [ "${app_version}" != "${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match chart appVersion ${app_version} in Chart.yaml"
            exit 1
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Verify chart version is not already published
        env:
          CHART_NAME: ${{ steps.chart.outputs.name }}
        run: |
          if out=$(helm show chart "${CHART_REGISTRY}/${CHART_NAME}" --version "${VERSION}" 2>&1); then
            echo "::error::Chart ${CHART_REGISTRY}/${CHART_NAME}:${VERSION} already exists"
            exit 1
          fi
          if ! grep -qiE 'not found|manifest unknown|name unknown' <<< "${out}"; then
            echo "::error::Unable to verify whether ${CHART_REGISTRY}/${CHART_NAME}:${VERSION} exists"
            echo "${out}"
            exit 1
          fi
          echo "Chart ${CHART_REGISTRY}/${CHART_NAME}:${VERSION} not found, OK to publish"

  build:
    name: Build, scan, push and sign
    needs:
      - tag_fix
      - helm_verify
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    outputs:
      image_digest: ${{ steps.digest.outputs.digest }}
    env:
      IMAGE: docker.io/intel/intel-tdx-qgs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Build images
        run: |
          docker build -t ${{ env.IMAGE }}:${{ needs.tag_fix.outputs.fixed_tag }} -f build/tdx-qgs/Dockerfile .
          docker build --target qgs-sources -t ${{ env.IMAGE }}:${{ needs.tag_fix.outputs.fixed_tag }}-sources \
            -f build/tdx-qgs/Dockerfile .

      - name: Trivy scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ needs.tag_fix.outputs.fixed_tag }}
          exit-code: 1
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Push images
        run: |
          docker push ${{ env.IMAGE }}:${{ needs.tag_fix.outputs.fixed_tag }}
          docker push ${{ env.IMAGE }}:${{ needs.tag_fix.outputs.fixed_tag }}-sources

      - name: Get image digests
        id: digest
        run: |
          image_sha=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE }}:${{ needs.tag_fix.outputs.fixed_tag }})
          echo "image_sha=${image_sha}" >> "$GITHUB_OUTPUT"
          echo "digest=${image_sha#*@}" >> "$GITHUB_OUTPUT"
          sources_sha=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE }}:${{ needs.tag_fix.outputs.fixed_tag }}-sources)
          echo "sources_sha=${sources_sha}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless sign images
        run: cosign sign --yes ${{ steps.digest.outputs.image_sha }} ${{ steps.digest.outputs.sources_sha }}

  helm:
    name: Package, push and sign Helm chart
    needs:
      - tag_fix
      - helm_verify
      - build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      CHART_REGISTRY: oci://ghcr.io/intel
      VERSION: ${{ needs.tag_fix.outputs.fixed_tag }}
      CHART_NAME: ${{ needs.helm_verify.outputs.chart_name }}
    defaults:
      run:
        working-directory: charts/intel-tdx-qgs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Build chart dependencies
        run: helm dependency build .

      - name: Pin image digest
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          if ! [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${IMAGE_DIGEST}'"
            exit 1
          fi
          yq -i '.image.digest = strenv(IMAGE_DIGEST)' values.yaml
          helm template test . | grep -q "@${IMAGE_DIGEST}\"" || {
            echo "::error::Failed to pin image digest in values.yaml"
            exit 1
          }

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: |
          helm lint --strict .
          helm package . --destination /tmp/charts

      - name: Push chart
        id: push
        run: |
          set -o pipefail
          helm push "/tmp/charts/${CHART_NAME}-${VERSION}.tgz" "${CHART_REGISTRY}" 2>&1 | tee /tmp/push.log
          digest=$(sed -n 's/^Digest: //p' /tmp/push.log)
          [ -n "${digest}" ] || { echo "::error::Failed to determine pushed chart digest"; exit 1; }
          echo "ref=${CHART_REGISTRY#oci://}/${CHART_NAME}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless sign chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io --username "${{ github.actor }}" --password-stdin
          cosign sign --yes "${{ steps.push.outputs.ref }}"
