name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tag_fix:
    name: Prepare image tag
    runs-on: ubuntu-24.04
    outputs:
      fixed_tag: ${{ steps.fix.outputs.tag }}
    env:
      TAGNAME: ${{ github.ref_name }}
    steps:
      - id: fix
        # Remove leading 'v' (e.g. v1.0.0 → 1.0.0)
        run: echo "tag=${TAGNAME:1}" >> "$GITHUB_OUTPUT"

  build:
    name: Build, scan, push and sign
    needs:
      - tag_fix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: docker.io/intel/intel-tdx-qgs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Build image
        run: docker build -t ${{ env.IMAGE }}:${{ needs.tag_fix.outputs.fixed_tag }} build/tdx-qgs/

      - name: Trivy scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ needs.tag_fix.outputs.fixed_tag }}
          exit-code: 1
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Push image
        run: docker push ${{ env.IMAGE }}:${{ needs.tag_fix.outputs.fixed_tag }}

      - name: Get image digest
        id: digest
        run: |
          echo "image_sha=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE }}:${{ needs.tag_fix.outputs.fixed_tag }})" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless sign image
        run: cosign sign --yes ${{ steps.digest.outputs.image_sha }}
